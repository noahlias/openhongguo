# Builds the Android app (android/): checks and tests its nsh UI, compiles the Go core with
# gomobile and packages the release APKs, one per ABI.
name: android-app

on:
  push:
    branches: [main, desktop]
    paths-ignore: ["**.md", "docs/**", "desktop/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "desktop/**"]
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with golang.org/x/mobile in bindings/mobile/core/go.mod.
  GOMOBILE_VERSION: v0.0.0-20261011034528-197770444867
  # Keep in step with ndkVersion in android/app/build.gradle.kts.
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/mobile/core/go.mod
          cache-dependency-path: bindings/mobile/core/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION
          gomobile init
      - run: make android-app
      - uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
