# Builds and tests the desktop client (desktop/) on Linux, macOS and Windows
# and uploads a ready-to-run package for each as a workflow artifact. When a
# release is published, the packages are attached to it too.
name: desktop

on:
  push:
    branches: [main, desktop]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: windows-2025, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PKG: openhongguo-desktop_${{ github.event.release.tag_name || 'dev' }}_${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libmpv-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev
      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv dylibbundler
      - name: MSVC tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        # shinchiro's builds ship libmpv-2.dll with a MinGW import library;
        # MSVC needs mpv.lib, made here from the DLL's export table.
        run: |
          set -eu
          dir="$RUNNER_TEMP/mpv"
          mkdir -p "$dir"
          asset=$(gh release view --repo shinchiro/mpv-winbuild-cmake --json assets \
            --jq '[.assets[].name | select(test("^mpv-dev-x86_64-[0-9]"))][0]')
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "$asset" --dir "$dir"
          7z x -y -o"$dir" "$dir/$asset" > /dev/null
          cd "$dir"
          { echo "LIBRARY libmpv-2.dll"; echo "EXPORTS"
            dumpbin //NOLOGO //EXPORTS libmpv-2.dll | awk '$1 ~ /^[0-9]+$/ && $4 ~ /^mpv_/ {print $4}'
          } > mpv.def
          lib //NOLOGO //DEF:mpv.def //OUT:mpv.lib //MACHINE:X64
          echo "MPV_LIBRARY_DIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Test
        working-directory: desktop
        run: cargo test --release --locked
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          mkdir -p "dist/$PKG"
          cp desktop/target/release/ohg-desktop desktop/assets/openhongguo.desktop \
            desktop/assets/openhongguo.svg LICENSE "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          app="dist/$PKG/openhongguo.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks"
          cp desktop/target/release/ohg-desktop "$app/Contents/MacOS/"
          cp desktop/assets/Info.plist "$app/Contents/"
          # Copies libmpv and every Homebrew library it needs into the bundle.
          dylibbundler -od -b -x "$app/Contents/MacOS/ohg-desktop" \
            -d "$app/Contents/Frameworks" -p @executable_path/../Frameworks/ \
            -s "$(brew --prefix)/lib"
          # Rewriting install names breaks signatures; arm64 refuses unsigned code.
          codesign --force --sign - "$app/Contents/Frameworks/"*.dylib
          codesign --force --sign - "$app"
          cp LICENSE "dist/$PKG/"
          (cd dist && ditto -c -k --keepParent "$PKG" "$PKG.zip")
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eu
          mkdir -p "dist/$PKG"
          cp desktop/target/release/ohg-desktop.exe desktop/target/release/ohg.dll \
            "$RUNNER_TEMP/mpv/libmpv-2.dll" LICENSE "dist/$PKG/"
          (cd dist && 7z a -tzip "$PKG.zip" "$PKG" > /dev/null)

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.*
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/"$PKG".* --clobber
