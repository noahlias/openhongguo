# Builds and tests the desktop client (desktop/) on Linux, macOS and Windows
# and uploads a ready-to-run package for each as a workflow artifact. When a
# release is published, the packages are attached to it too.
name: desktop

on:
  push:
    branches: [main, desktop]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64 }
          # Homebrew's libraries require the macOS they were built on, so the
          # runner sets the oldest macOS the app opens on (Info.plist says so).
          - { os: macos-15, name: macos-arm64 }
          - { os: windows-2025, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PKG: openhongguo-desktop_${{ github.event.release.tag_name || 'dev' }}_${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop

      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libmpv-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev
      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg dylibbundler
      - name: MSVC tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        # shinchiro's builds ship libmpv-2.dll with a MinGW import library;
        # MSVC needs mpv.lib, made here from the DLL's export table. The same
        # release's ffmpeg.exe ships with the app to decode HEIC covers.
        run: |
          set -eu
          # Git Bash's coreutils `link` would shadow MSVC's link.exe for rustc.
          rm -f /usr/bin/link.exe
          dir="$RUNNER_TEMP/mpv"
          mkdir -p "$dir"
          tag=$(gh release view --repo shinchiro/mpv-winbuild-cmake --json tagName --jq .tagName)
          for want in '^mpv-dev-x86_64-[0-9]' '^ffmpeg-x86_64-git-'; do
            asset=$(gh release view "$tag" --repo shinchiro/mpv-winbuild-cmake --json assets \
              --jq "[.assets[].name | select(test(\"$want\"))][0]")
            gh release download "$tag" --repo shinchiro/mpv-winbuild-cmake --pattern "$asset" --dir "$dir"
            7z x -y -o"$dir" "$dir/$asset" > /dev/null
          done
          cd "$dir"
          test -f ffmpeg.exe
          { echo "LIBRARY libmpv-2.dll"; echo "EXPORTS"
            dumpbin //NOLOGO //EXPORTS libmpv-2.dll | awk '$1 ~ /^[0-9]+$/ && $4 ~ /^mpv_/ {print $4}'
          } > mpv.def
          test "$(grep -c '^mpv_' mpv.def)" -gt 50
          lib //NOLOGO //DEF:mpv.def //OUT:mpv.lib //MACHINE:X64
          echo "MPV_LIBRARY_DIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Test
        working-directory: desktop
        run: cargo test --release --locked
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          mkdir -p "dist/$PKG"
          cp desktop/target/release/ohg-desktop desktop/assets/openhongguo.desktop \
            desktop/assets/openhongguo.svg LICENSE "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: desktop/scripts/bundle-macos.sh dist "$PKG.dmg"
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        # dyld resolves every library before main runs, so a bundle that
        # cannot load dies at once. The unbundled build runs too, to tell a
        # packaging fault from one the runner itself causes.
        run: |
          set -u +e
          launch() {
            RUST_LOG=info RUST_BACKTRACE=1 OHG_CONFIG_DIR="$RUNNER_TEMP/cfg" "$1" > "$2" 2>&1 &
            local pid=$!
            sleep 10
            local alive=0
            if kill -0 "$pid" 2> /dev/null; then
              kill "$pid"; echo "== $1: running after 10 s"
            else
              wait "$pid"; echo "== $1: exited with $?"; alive=1
            fi
            cat "$2"
            return "$alive"
          }
          launch desktop/target/release/ohg-desktop "$RUNNER_TEMP/plain.log"
          launch dist/stage/openhongguo.app/Contents/MacOS/ohg-desktop "$RUNNER_TEMP/bundle.log"
          bundled=$?
          report=$(ls -t ~/Library/Logs/DiagnosticReports/ohg-desktop* 2> /dev/null | head -1)
          [ -n "$report" ] && head -c 6000 "$report"
          exit "$bundled"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eu
          mkdir -p "dist/$PKG"
          cp desktop/target/release/ohg-desktop.exe desktop/target/release/ohg.dll \
            "$RUNNER_TEMP/mpv/libmpv-2.dll" "$RUNNER_TEMP/mpv/ffmpeg.exe" LICENSE "dist/$PKG/"
          (cd dist && 7z a -tzip "$PKG.zip" "$PKG" > /dev/null)

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.*
          if-no-files-found: error

  # Runs no third-party action, so only this job can write to the release.
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
